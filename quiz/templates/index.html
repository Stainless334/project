<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STAINLESS Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>STAINLESS Quiz</h1>
  <p class="lead">Pick a topic, choose your level, and let AI write a fresh quiz for you.</p>

  <main class="card">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}

    <form action="{{ url_for('quest') }}" method="get">
      <div class="field">
        <label class="field-label" for="topic">Topic</label>
        <input type="text" id="topic" name="topic" placeholder="e.g. Python, World History" required>
      </div>
      <div class="field">
        <label class="field-label" for="level">Difficulty</label>
        <select id="level" name="level" required>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label" for="number">Number of questions (5 to 25)</label>
        <input type="number" id="number" name="number" min="5" max="25" value="5" required>
      </div>
      <div class="btn-row"><button class="btn" type="submit">Start quiz</button></div>
    </form>
  </main>
  <script>try { sessionStorage.removeItem("deadline"); } catch (e) {}</script>
</body>
</html>
