<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results | STAINLESS Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Quiz complete</h1>
    <div class="score">{{ score }} / {{ number }}</div>
    <div class="percent">{{ percent }}%</div>
    <p class="remark">{{ remark }}</p>
    <form action="{{ url_for('restart') }}" method="post">
      <div class="btn-row"><button class="btn" type="submit">Take another quiz</button></div>
    </form>
  </main>
  <script>try { sessionStorage.removeItem("deadline"); } catch (e) {}</script>
</body>
</html>
